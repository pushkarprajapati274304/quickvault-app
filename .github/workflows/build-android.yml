name: Build Android APK and AAB (Play Store Bundle)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compile Release APK and AAB Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install NPM Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Initialize & Sync Capacitor Android
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Generate Release Keystore (if not present)
        run: |
          if [ ! -f android/app/release.keystore ]; then
            keytool -genkey -v -keystore android/app/release.keystore -alias quickvault_key -keyalg RSA -keysize 2048 -validity 10000 -storepass quickvaultpass -keypass quickvaultpass -dname "CN=Pushkar, OU=QuickVault, O=Personal, L=City, ST=State, C=IN"
          fi

      - name: Build Signed Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Build Signed Play Store Release AAB Bundle
        run: |
          cd android
          ./gradlew bundleRelease

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickVault-Release-APK
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload Play Store AAB Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: QuickVault-PlayStore-AAB
          path: android/app/build/outputs/bundle/release/*.aab
